include conf/machine/raspberrypi4.conf

# Map your custom machine to the Pi4 hardware
KMACHINE:rpi-fastboot = "raspberrypi4"

# Use the existing Pi4 default configuration
KBUILD_DEFCONFIG:rpi-fastboot = "bcm2711_defconfig"
KCONFIG_MODE = "--alldefconfig"

# Fast-Boot requirements from Day 5
SERIAL_CONSOLES = "115200;ttyS0"
IMAGE_FSTYPES = "squashfs-xz rpi-sdimg"

# Disable the 2-second rainbow splash screen and boot delay
DISABLE_SPLASH = "1"
BOOT_DELAY = "0"
BOOT_DELAY_MS = "0"

# Optimize image size - squashfs is great for fast-boot as it's read-only and compressed
# You already have this, but ensuring the kernel supports it is key
IMAGE_FSTYPES = "squashfs-xz rpi-sdimg"

# Strip unnecessary features to reduce build time and image size
MACHINE_FEATURES:remove = "apm vfat screen touchscreen keyboard"

# Day 7: Device Tree Optimization
# Disables hardware at the firmware level so the kernel doesn't probe it
RPI_EXTRA_CONFIG = " \
    dtparam=audio=off \
    dtparam=i2c_arm=off \
    dtparam=spi=off \
    dtoverlay=disable-bt \
    dtoverlay=disable-wifi \
    disable_splash=1 \
    boot_delay=0 \
    "
# Force BusyBox to handle init and login management
VIRTUAL-RUNTIME_init_manager = "busybox"
VIRTUAL-RUNTIME_login_manager = "busybox"

# Use the lightweight mdev instead of heavy udev for dynamic device management
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"

BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j 4"

BOOTDD_VOLUME_ID = "BOOT"

# Force the build system to skip U-Boot integration
RPI_USE_U_BOOT = "0"

# Ensure the kernel image type is set correctly for direct boot
KERNEL_IMAGETYPE = "zImage"
